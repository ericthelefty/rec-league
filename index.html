<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSz Portland Rec League (Unofficial)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16224a;--navy2:#22306a;--red:#d7263d;--red-d:#b01d31;--blue:#2f5bd3;
  --bg:#f3f5f9;--card:#ffffff;--ink:#16224a;--text:#2a3150;--mut:#5d6680;--line:#dde2ec;--soft:#e9edf5;--redsoft:#fdecee;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:Barlow,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1530;--card:#18204a;--ink:#f2f4fb;--text:#d7dbec;--mut:#9aa3c2;--line:#2a3566;--soft:#212b5a;--redsoft:#3a1a2c;--blue:#8fb0ff;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);font-weight:600;text-underline-offset:2px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--disp);color:var(--ink);margin:0;line-height:1.05}

/* masthead */
.mast{background:var(--navy);color:#fff}
.stripes{height:8px;background:repeating-linear-gradient(90deg,#fff 0 10px,#0c1430 10px 20px)}
.mast .in{max-width:760px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:12px}
.brand{font:800 22px/1 var(--disp);letter-spacing:.2px;color:#fff}
.brand small{display:block;font:500 13px/1.3 var(--body);color:#aab3d6;letter-spacing:0;margin-top:3px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:linear-gradient(90deg,var(--red) 50%,#4f7cff 50%)}

/* site search */
.mast .in{flex-wrap:wrap}
.brand{flex:1;min-width:0}
.srch{margin-left:auto;width:220px}
.srch input{width:100%;font-size:15px;padding:6px 11px;border:1.5px solid #34437f;border-radius:8px;background:#22306a;color:#fff}
@media (max-width:640px){.srch{width:100%;margin-left:0}}
.srch input::placeholder{color:#aab3d6}
.srch input:focus{outline:none;border-color:#fff}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--text)}
.res:hover{border-color:var(--ink)}
.res b{color:var(--ink);font-size:17px}
.res .where{font-size:13px;color:var(--mut)}
.res .snip{font-size:15px;margin-top:2px}
mark{background:#ffe08a;color:#16224a;border-radius:3px;padding:0 1px}
.rgroup{font:800 24px var(--disp);color:var(--ink);margin:22px 0 8px}
nav{max-width:760px;margin:0 auto;padding:6px 10px 0;display:flex}
nav a{flex:1;text-align:center;padding:10px 6px 12px;color:#aab3d6;text-decoration:none;font:700 18px var(--disp);letter-spacing:.3px;border-bottom:4px solid transparent}
nav a.on{color:#fff;border-color:var(--red)}
nav a:hover{color:#fff}
main{max-width:760px;margin:0 auto;padding:0 18px 72px}

/* hero (the one bold thing) */
.hero{background:var(--navy);color:#fff;margin:0 -18px;padding:26px 18px 30px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-weight:800;font-size:clamp(46px,13vw,84px);line-height:.92;letter-spacing:-.5px}
.hero h1 .w{color:#7f9bff}
.hero h1 .r{color:#ff4d61}
.heroimg{display:block;width:calc(100% + 36px);max-width:none;height:auto;margin:-26px -18px 22px}
.hero p{max-width:34em;margin:14px 0 0;color:#d5daf0;font-size:17px}
.hero p.lead{margin:0;color:#fff;font:700 clamp(24px,6vw,32px)/1.15 var(--disp);letter-spacing:.2px}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.unof{margin:16px 0 0;font-size:13px;color:#8f99c3}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 15px;font:600 16px var(--body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.light{background:transparent;border-color:#3a4a8f;color:#fff}
.btn.light:hover{border-color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;border-width:1.5px}
.btn img{width:26px;height:26px;border-radius:50%;background:#fff;display:block;margin-left:-4px}
.btn img.logo{background:none;border-radius:0;width:24px;height:24px;margin-left:-2px;object-fit:contain}
.btn[disabled]{opacity:.6;cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer}

/* sections */
.sec{padding:30px 0 4px}
.sec>h2{font-size:32px;font-weight:800;margin-bottom:4px}
.sec h2{display:flex;align-items:flex-start;gap:10px}
.sec>.lede{margin:0 0 16px;color:var(--mut)}
.hr{border:0;border-top:2px solid var(--line);margin:30px 0 0}
.mut{color:var(--mut)}
.small{font-size:14px}

/* start-here steps (a real sequence) */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);font:800 30px/1 var(--disp);color:var(--red);text-align:center;padding-top:2px}
.steps b{display:block;color:var(--ink);font-size:18px}
.steps p{margin:2px 0 0}

/* news */
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:12px}
.post.latest{border:2px solid var(--ink)}
.post .when{font-size:14px;color:var(--mut)}
.post h3{font:700 25px/1.1 var(--disp);margin:4px 0 8px}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere}
.post .new{display:inline-block;background:var(--red);color:#fff;font:700 13px var(--body);padding:1px 8px;border-radius:6px;margin-left:6px;vertical-align:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.empty{background:var(--soft);border-radius:12px;padding:16px;color:var(--mut)}

/* info blocks */
.facts{display:grid;grid-template-columns:1fr;gap:0;margin:0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.facts dt{font:700 18px/1.3 var(--disp);color:var(--ink)}
.facts dd{margin:0}
@media (max-width:460px){.facts div{grid-template-columns:1fr;gap:2px}}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:4px 0}
.callout{background:var(--redsoft);border-left:5px solid var(--red);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:16px}
.callout h3{font-size:22px;margin-bottom:4px}
.hang{padding:12px 0;border-top:1px solid var(--line)}
.hang:first-of-type{border-top:0}
.hang b{font-size:18px;color:var(--ink)}
h3.sub{font-size:22px;margin:18px 0 4px}

/* games */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;margin:22px 0 14px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font:700 17px var(--disp);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.search{width:100%;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.search:focus{border-color:var(--blue);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 2px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.meta{color:var(--mut);font-size:14px;margin:10px 0 4px}
.letter{font:800 20px var(--disp);color:var(--red);margin:16px 0 4px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--soft)}
.item .nm{flex:1;min-width:0;font-weight:600;color:var(--ink)}
.item .sm{display:block;font-weight:400;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.has{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.has.y{background:var(--blue)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--soft);color:var(--mut)}
.t18{background:var(--ink);color:var(--bg)}
.star{color:var(--red)}
.pickbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.cb{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:15px}
.big{display:block;width:100%;margin:14px 0;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font:800 24px var(--disp);letter-spacing:.3px;cursor:pointer}
.big:hover{background:var(--red-d)}
.big[disabled]{opacity:.5}
.result{background:var(--navy);color:#e3e7f7;border-radius:14px;padding:20px}
.result h2{color:#fff;font-size:38px;margin:8px 0}
.result .tag{background:#2b3a7a;color:#cfd6f3}
.result .empty{background:#22306a;color:#cfd6f3}
@media (prefers-reduced-motion:no-preference){.result.pop{animation:pop .22s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}}
.lineup ol{margin:8px 0 0;padding-left:24px}
.lineup li{padding:3px 0}
.result .linkish{color:#a9bdff}

.sec{position:relative}
.sec>h2,.steps li{padding-right:38px}
.foot2{max-width:760px;margin:0 auto;padding:10px 18px 40px;text-align:center;color:var(--mut);font-size:14px;border-top:2px solid var(--line)}
main{padding-bottom:40px}
.toc{padding:22px 0 6px;border-bottom:2px solid var(--line)}
.toc h2{font-size:34px;font-weight:800;margin-bottom:8px}
.toc .chips{padding-top:4px}
.toc .chip{font-size:15px;padding:7px 13px}
.toc .chip:hover{border-color:var(--ink)}
.sec{scroll-margin-top:12px}
@media (max-width:640px){.sec{scroll-margin-top:66px}}
/* game page + forms */
.back{margin:20px 0 10px}
.gp h2{font-size:42px;font-weight:800;margin:6px 0 10px}
.block{margin-top:18px}
.block h3{font:700 20px var(--disp);margin-bottom:4px}
.block .body{white-space:pre-wrap}
.draft{font-size:14px;color:var(--mut);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px}
label.f{display:block;font-weight:600;color:var(--ink);margin:14px 0 5px}
textarea,input[type=text]{width:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea:focus,input[type=text]:focus{border-color:var(--blue);outline:none}
textarea{min-height:90px;resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.status{font-size:14px;color:var(--mut)}

/* ===== sports-network look (v5) ===== */
:root{--bg:#eef1f6;--line:#d5dbe7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1530;--line:#2a3566}}
body{font-size:15px;line-height:1.5}
.stripes{display:none}
.mast .in{max-width:1240px;padding:0 20px;min-height:56px;gap:4px 24px;flex-wrap:nowrap}
a.brand{flex:none;color:#fff;text-decoration:none;font:italic 800 26px/1 var(--disp);letter-spacing:.01em;padding:10px 0;white-space:nowrap}
a.brand .pdx{color:#ff5468}
nav{max-width:none;margin:0;padding:0;gap:22px;flex:none}
nav a{flex:none;padding:17px 0;font:700 17px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#c9d1e6;border-bottom:0}
nav a.on{color:#fff;box-shadow:inset 0 -4px 0 var(--red)}
.srch{margin-left:auto;width:200px}
.srch input{border:0;border-radius:4px;background:#2a3966;padding:8px 12px}
.disc{background:#0e1734;color:#c9d1e6;font-size:13px}
.disc p{max-width:1240px;margin:0 auto;padding:6px 20px}
.tick{background:var(--card);border-bottom:1px solid var(--line)}
.tick .tin{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto}
.tick .lbl{flex:none;display:flex;align-items:center;padding-right:14px;border-right:1px solid var(--line);font:800 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.tick a.ti{flex:none;display:block;padding:7px 14px;border-right:1px solid var(--line);min-width:150px;color:var(--ink);text-decoration:none;font-weight:400}
.tick a.ti:hover{background:var(--soft)}
.tick .w{display:block;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tick .w.now{color:var(--red)}
.tick .ti b{display:block;font:700 16px/1.2 var(--disp)}
.tick .s{display:block;font-size:13px;color:var(--mut)}
.tick .lbl{line-height:1.1}
.tick a.more-shows{min-width:0;border-right:0}
.tick .ted{flex:none;align-self:center;margin-left:10px}
.shell{max-width:1240px;margin:0 auto;padding:12px 20px 30px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
main{max-width:none;margin:0;padding:0;min-width:0}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.mod{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mod h2,.sec>h2,.sec>.row.between,.toc h2{font:800 16px/1.2 var(--disp);text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.mod h2{margin:0;padding:9px 12px;border-bottom:1px solid var(--line)}
.ql a{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:40px;border-top:1px solid var(--soft);color:var(--ink);text-decoration:none;font-size:14px}
.ql a:first-of-type{border-top:0}
.ql a:hover{background:var(--soft)}
.ql svg{flex:none}
.gamebox{background:var(--navy);color:#fff;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.gamebox h2{color:#fff;font:italic 800 20px/1.05 var(--disp);text-transform:uppercase;margin:0}
.gamebox p{margin:0;font-size:14px;color:#c9d1e6}
.gamebox .btn{justify-content:center}
.btn{border-radius:4px;padding:8px 14px;font:600 15px var(--body);border-width:1.5px}
.btn.wht{background:#fff;border-color:#fff;color:var(--navy)}
.btn.wht:hover{border-color:#fff;filter:brightness(.95)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 14px 12px;margin:0 0 12px;position:relative}
.sec>h2,.sec>.row.between{margin:0 -14px 10px;padding:9px 14px;border-bottom:1px solid var(--line);padding-right:14px}
.sec>.row.between h2{font:inherit;text-transform:inherit;letter-spacing:inherit;padding:0}
.sec>.lede{margin:0 0 10px;font-size:14px}
h3.sub{font-size:18px;margin:14px 0 2px}
.facts div{grid-template-columns:120px 1fr;padding:8px 0;gap:10px}
.facts dt{font-size:16px}
.steps li{grid-template-columns:28px 1fr;gap:10px;padding:8px 0;padding-right:0}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font:800 14px/24px var(--disp);padding:0;text-align:center}
.steps b{font-size:15px}
.steps p{font-size:14px}
.hero{margin:0 0 12px;border-radius:8px;padding:22px 22px 20px;border-bottom:6px solid var(--red)}
.hero .kick{margin:0 0 8px;font:700 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#ff8a98}
.hero h1{font:italic 800 clamp(30px,4.2vw,44px)/.98 var(--disp);text-transform:uppercase;letter-spacing:0;color:#fff}
.hero p{font-size:16px;margin:10px 0 0}
.hero .acts{margin-top:14px}
.homegrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:start}
.hl{list-style:none;margin:0 -14px;padding:0}
.hl li{border-top:1px solid var(--soft)}
.hl li:first-child{border-top:0}
.hl button{display:grid;grid-template-columns:52px 1fr;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--text)}
.hl button:hover{background:var(--soft)}
.hl button:hover b{color:var(--red);text-decoration:underline}
.hl .d{font-size:13px;font-weight:600;color:var(--mut)}
.hl b{display:block;color:var(--ink);font-size:15px;line-height:1.3}
.hl .x{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.sec .post,.sec .post.latest{border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0;margin:0;background:none}
.sec .post:first-of-type{border-top:0;padding-top:2px}
.post h3{font-size:21px}
.post .new{border-radius:4px}
.toc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 14px 12px;margin:0 0 12px}
.toc h2{margin:0 -14px 8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.toc .chip{font-size:14px;padding:5px 11px}
.gp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.gp h2{font-size:34px}
.back{margin:0 0 10px}
.seg{margin:0 0 10px;border-radius:6px}
.seg button{border-radius:4px;font-size:16px;padding:6px 14px}
.search{font-size:15px;padding:9px 12px;border-radius:6px}
.list{border-radius:6px}
.item{padding:8px 12px}
.letter{font-size:17px;margin:12px 0 4px}
.pickbox,.result{border-radius:8px}
.big{border-radius:6px;font-size:21px;padding:12px}
.res{border-radius:8px;padding:10px 12px}
.foot2{max-width:1240px;border-top:1px solid var(--line)}
.rgroup{font-size:20px;margin:14px 0 6px}
@media (max-width:1100px){.homegrid{grid-template-columns:1fr}}
.shell>main{grid-column:2;grid-row:1}.rail{grid-column:1;grid-row:1}
@media (max-width:900px){.shell{grid-template-columns:1fr}.shell>main,.rail{grid-column:auto;grid-row:auto}}
.more{white-space:nowrap}
.more .dom{font-weight:400;color:var(--mut)}
/* mobile sticky header + hamburger */
.burger{display:none}
.mdisc{display:none}
@media (max-width:640px){
  .mast{position:sticky;top:0;z-index:30;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .stripes{height:5px}
  .mast .in{padding:9px 14px;flex-wrap:nowrap;min-height:0}
  a.brand{font-size:22px;padding:4px 0}
  .shell{padding:10px 12px 24px}
  .tick .tin{padding:0 12px}
  .disc p{padding:5px 14px;font-size:12px}
  .brand{font-size:19px}
  .brand small{display:none}
  .burger{display:flex;flex-direction:column;justify-content:center;gap:4px;flex:none;width:42px;height:38px;margin-left:auto;padding:0 10px;background:#22306a;border:1.5px solid #34437f;border-radius:8px;cursor:pointer}
  .burger span{display:block;height:2.5px;background:#fff;border-radius:2px;transition:transform .2s,opacity .2s}
  .mast.open .burger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  .mast.open .burger span:nth-child(2){opacity:0}
  .mast.open .burger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
  .srch{display:none}
  nav{display:none}
  .mast.open .in{flex-wrap:wrap}
  .mast.open .srch{display:block;width:100%;margin:8px 0 0;order:5}
  .mast.open nav{display:flex;flex-direction:column;padding:2px 0 10px;width:100%;order:6;margin:0 -14px;gap:0}
  .mast.open{box-shadow:0 10px 18px rgba(0,0,0,.3)}
  .mast.open nav a{text-align:left;padding:12px 18px;border-bottom:0;border-left:4px solid transparent;font-size:20px;box-shadow:none}
  .mast.open nav a.on{border-left-color:var(--red);background:#1e2b5c}
}
@media (prefers-reduced-motion:reduce){.burger span{transition:none}}
/* Highlights: Rec League moments (first names only, final score, no player stats) */
.sb{background:var(--navy);color:#fff;border-radius:8px;border-bottom:6px solid var(--red);padding:16px 18px 16px;margin:0 0 12px}
.sb .k{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font:700 14px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#ff8a97}
.sb .k a{color:#fff;text-transform:none;letter-spacing:0;font:600 14px var(--body)}
.sb .line{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:10px}
.sb .tm{display:flex;align-items:center;gap:12px}
.sb .bar{width:10px;height:46px;border-radius:2px;flex:none}
.sb .nm{font:800 22px/1.1 var(--disp);color:#fff}
.sb .cap{font-size:13px;color:#c9d2ea}
.sb .sc{font:800 58px/1 var(--disp);color:#fff}
.sb .lose .nm,.sb .lose .sc{color:#aab4d4}
.sb .fin{font:600 18px var(--disp);color:#c9d2ea;letter-spacing:.06em}
.sb .win{font:700 12px var(--body);background:#fff;color:#16224a;padding:1px 6px;border-radius:3px;vertical-align:4px;margin-left:6px}
.sb p{margin:12px 0 0;color:#e3e8f5;font-size:15px;font-weight:400;max-width:none}
.sb .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sb.big .sc{font-size:72px}.sb.big .nm{font-size:28px}.sb.big .bar{height:60px}
.plays{list-style:none;margin:0;padding:0}
.plays li{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.plays li:last-child{border-bottom:0}
.plays .n{font:800 32px/1 var(--disp);color:var(--red);width:28px;text-align:center;flex:none}
.plays .t{font:700 16px/1.6 var(--disp);color:var(--mut);width:58px;flex:none}
.plays .bd{flex:1;min-width:0}
.plays .g{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.plays b{display:block;color:var(--ink);font-size:16px;line-height:1.3;margin:2px 0 3px}
.plays p{margin:0;font-size:15px;line-height:1.45}
.plays .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.plays .btn svg{flex:none}
.hlnote{font-size:13px;color:var(--mut);margin:8px 0 0}
.recs div{padding:6px 0;font-size:15px}.recs .l{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.recs b{color:var(--ink)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 12px}
.teams .sec{margin:0}
.teams ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:16px}
.teams b{color:var(--ink)}
.sec.tr{border-top:4px solid var(--red)}.sec.tb{border-top:4px solid var(--blue)}.sec.tn{border-top:4px solid var(--navy)}
.deb{font:700 11px var(--body);background:var(--redsoft);color:var(--red-d);padding:2px 6px;border-radius:3px;margin-left:4px;white-space:nowrap}
.gl{margin:0;padding-left:22px;font-size:15px;line-height:1.8}@media (min-width:700px){.gl{columns:2}}
.crumb{font-size:14px;margin:0 0 10px;color:var(--mut)}
#menu .nw{font:700 10px var(--body);background:var(--red);color:#fff;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:2px;letter-spacing:0}
</style>

yers": "", "howto": "", "suggestion": "", "notes": "", "fav": false}, {"id": 212, "name": "Special Delivery", "tags": ["Streaming"], "adult": false, "desc": "", "draft": false, "players": "", "howto": "", "suggestion": "", "notes": "", "fav": false}, {"id": 213, "name": "Teleprompter Musical", "tags": ["Streaming"], "adult": false, "desc": "", "draft": false, "players": "", "howto": "", "suggestion": "", "notes": "", "fav": false}], "news": [{"id": 10, "date": "2026-10-19", "from": "Brooke", "title": "CSz Rec League Wednesday, 10-20 - No Workshop", "body": "There is no Rec League workshop this week. Instead, come out and support the 301 showcase starting at 8pm."}, {"id": 9, "date": "2026-10-17", "from": "Brooke Chamberlain, PCT Artistic Director and Rec League Director", "title": "Auditions: The PCT Comedy Revue (Late Night)", "body": "Brooke is producing The PCT Comedy Revue, a comedy variety show running Saturdays in December at 9 PM at Portland Comedy Theater, and is looking for acts.\n\nWanted: stand-up, improv duos and groups, storytellers, musicians, magicians, jugglers, and other unique acts. Sets should be 10–30 minutes. Clean comedy is a plus, but not required.\n\nAuditions: Sunday, November 1, 1–4 PM at PCT, in 10-minute slots. You don't need to perform your whole act, just enough to show your talent and style.\n\nTo schedule a slot, email Brooke at brooke@portlandcomedy.com. Can't make November 1? Reach out to her directly to set something else up. A video or recording of a past performance also works."}, {"id": 8, "date": "2026-10-12", "from": "", "title": "CSz Rec League, Wednesday October 14th", "body": "This week's workshop: \"Scene Starts\" with coach Kevin. The session will be held in the lobby."}, {"id": 7, "date": "2026-10-06", "from": "Brooke", "title": "Theme to tomorrow night's workshop", "body": "Tomorrow night's Workshop has a theme: tropical / Hawaiian shirts and attire!"}, {"id": 6, "date": "2026-10-05", "from": "Brooke", "title": "CSz Rec League, Wednesday 10.7.26", "body": "Coach Brooke is leading a session on guessing games, the kind used before intermission, such as 20 Things, Hot Bell and Sideline Debate."}, {"id": 5, "date": "2026-10-04", "from": "Brooke", "title": "Upcoming Classes at Portland Comedy Theater", "body": "Upcoming classes at PCT for October and November include:\n• Improv for Anxiety\n• Jane Austen Improv\n• Scenework Intensive"}, {"id": 4, "date": "2026-09-29", "from": "", "title": "CSz Rec League, Wednesday 9.30", "body": "Coach Dave Russ is leading a workshop on identifying and breaking the unwritten rules of improv."}, {"id": 3, "date": "2026-09-29", "from": "Brooke", "title": "Tech for 301 showcase", "body": "Volunteer needed: Brooke is looking for someone to run tech for the 301 showcase on October 21st."}, {"id": 2, "date": "2026-07-17", "from": "", "title": "Pro-Am Match night: first Friday of every month", "body": "Pro-Am Match night will be held on the first Friday of every month.\n\nThis email also included instructions for using SchedgeHog to sign up for Pro-Am matches."}, {"id": 1, "date": "2026-07-07", "from": "", "title": "New sign-up system: SchedgeHog", "body": "Rec League is moving to a new sign-up program, SchedgeHog.\n\nReminders:\n• Weekly workshops are $15.\n• Parking is available in the Ace Hardware lot starting at 6:30 PM."}, {"id": 0, "date": "2025-12-09", "from": "", "title": "Workshop price going up to $15", "body": "Starting in the new year, weekly workshops will be $15."}, {"id": 11, "date": "2026-10-28", "from": "", "title": "Rec League Match: Sunday, November 1", "body": "Sunday, November 1, 5–6:30 PM at Portland Comedy Theater. Call time is 4 PM.\n\nRef: Meagan Gombart\nPlayers: David Seidman, Mindy Crosato, Stephanie Anderson, Sav Milligan, Cameron Elde, Cassandra Dempsey\nAnnouncer: Rachel Silver\nHouse Manager: Brooke Chamberlain\n\nLineups: https://schedule.rosterpossum.com/theaters/pct/lineups"}, {"id": 12, "date": "2026-10-28", "from": "Aaron Ketzenberger, Education Director", "title": "Intermediate Musical Improv starts next week", "body": "Intermediate Musical Improv, led by Pat Short and Betse Green, starts next week.\n\nThe class focuses on musical short-form games like Lounge Lizards and Sing It, with lots of reps and side coaching to build confidence with improvised songs. It's been a while since it was last offered, and with the coaches' travel schedules it's unclear when it'll run again.\n\nSign up: https://cszportland.corsizio.com/event/6a9f187806515f5698af44b1\n\nQuestions? Email Aaron, PCT's Education Director, at aaron@portlandcomedy.com"}, {"id": 13, "date": "2026-09-23", "from": "Kristen Ferris and Jamie Montgomery, via the Rec League email", "title": "Trial Run has new hosts, plus an Improv Jam", "body": "Kristen Ferris and Jamie Montgomery have taken over Trial Run on 4th Sundays, and they're adding an Improv Jam afterward.\n\nAn Improv Jam is a chance to play: performers who may or may not know each other get together just to do scenes, meet people, try new styles and experiment in a low-stakes setting. It starts with a warm-up exercise, then everyone splits into two groups and each plays an All Play. All experience levels are welcome.\n\nThe September jam was free for all Rec Leaguers.\n\nCome watch Trial Run too. It features new groups and new formats trying things out, and they need an audience to give feedback.\n\nTrial Run: 5:00–6:30 PM\nImprov Jam: 7:00 PM until it wraps"}, {"id": 14, "date": "2026-10-28", "from": "Portland Comedy Theater", "title": "November classes at PCT", "body": "A new round of classes starts in November. All classes: https://www.portlandcomedy.com/classes\n\n• Improv 201: Scenework with Dr. Dave Russ. Mondays, Nov. 2–Dec. 7, 7–9 PM. https://cszportland.corsizio.com/event/6ab421fd3cfe5ea720e32dcb\n\n• Improv Music, Intermediate with Patrick Short and Betse Green. Thursdays, Nov. 5–Dec. 3, 7–9 PM (skipping Thanksgiving). https://cszportland.corsizio.com/event/6a9f187806515f5698af44b1\n\n• The Long Game: Narrative Improv. Saturdays, Nov. 7–Dec. 19, 2–4 PM. https://cszportland.corsizio.com/event/6ab1d46958bc4d9357a6b0c0\n\n• NEW: Five Things Intensive with Andrew Kemp, for Rec League and Pro Team players who want to level up their Five Things. Thursdays, Nov. 19–Dec. 17, 7–9 PM. Requires 101, 201 and 301, or similar training elsewhere. https://cszportland.corsizio.com/event/6aca7eb7ad6cde8a2c742d87\n\n• Intro to Storytelling with Leann Johnson. Mondays, Nov. 23–Dec. 21, 7–9 PM, with a student showcase Sunday, Dec. 20 at 7:30 PM. https://cszportland.corsizio.com/event/6aadf2b5ce906d3728c78343\n\n• NEW: SoloProv with Nick Condon, on building a show that's uniquely you. Mondays, Nov. 23–Dec. 14, 7–9 PM. Best for people with at least 6 months of training. https://cszportland.corsizio.com/event/6ac697845faba769086d805a\n\n• Improv drop-ins: Sundays, Nov. 8 and Nov. 22, 10 AM–12 PM. Good for beginners and for anyone who wants extra reps. https://www.portlandcomedy.com/start-improv"}, {"id": 15, "date": "2026-10-27", "from": "Portland Comedy Theater", "title": "Halloween weekend shows", "body": "• ComedySportz: Friday, Oct. 30 at 7 PM and Halloween Saturday, Oct. 31 at 7 PM.\n• Rec League match: Sunday, Nov. 1 at 5 PM.\n• Spooky Bits (Halloween edition of Naughty Bits, very 18+): Friday, Oct. 30 and Saturday, Oct. 31 at 9 PM.\n\nTickets: https://portlandcomedy.com/buy-tickets\n\nComedySportz matches are also livestreamed, pay-what-you-can. Register for the Zoom stream: https://us02web.zoom.us/webinar/register/WN_AdFsxPn5S-eDzPu0vUbmBA"}], "social": [{"id": 1, "title": "Post-Rec League drinks", "when": "Just about every Wednesday night, after Rec League", "details": "Rec Leaguers head out for beverages after the Workshop, usually at Triple Lindy. Come along!"}], "upcoming": [{"id":1,"when":"2026-11-06","time":"7 PM","title":"ComedySportz","sub":"Get tickets","link":"https://www.portlandcomedy.com/buy-tickets?pg=event&eid=2434&edid function discordLive(){return new Date()<DISCORD_ENDS}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ext(u,txt){return '<a href="'+u+'" target="_blank" rel="noopener">'+txt+'</a>'}
function byId(id){for(var i=0;i<G.length;i++)if(G[i].id==id)return G[i]}
function has(g){return !!(g.desc||g.howto)}
function tags(g){return g.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+(g.adult?'<span class="tag t18">18+</span>':'')}
function $(id){return document.getElementById(id)}
function shortLinks(s){return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,function(u){var d=u.replace(/^https?:\/\/(www\.)?/,'').split(/[\/?#]/)[0];return '<a class="more" href="'+u+'" target="_blank" rel="noopener" title="'+u+'">More info</a>'}).replace(/(^|[\s(])([\w.+-]+@[\w-]+\.[\w.]*[a-z])/gi,'$1<a href="mailto:$2">$2</a>')}
function noUrls(s){return s.replace(/https?:\/\/\S+/g,'').replace(/[ \t]+([.,;:])/g,'$1').replace(/:\s*([•]|$)/g,' $1').replace(/\s{2,}/g,' ').trim()}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,'<a href="$1" target="_blank" rel="noopener" style="word-break:break-all">$1</a>').replace(/(^|[\s(])([\w.+-]+@[\w-]+\.[\w.]*[a-z])/gi,'$1<a href="mailto:$2">$2</a>')}
function fmtDate(d){var p=(d||'').split('-');if(p.length!==3)return esc(d);return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

function upcomingNow(){var t=today();return state.upcoming.filter(function(u){return !isDate(u.when)||u.when>=t}).sort(function(a,b){var da=isDate(a.when),db=isDate(b.when);if(da&&db)return a.when.localeCompare(b.when);return da?-1:db?1:0})}
function renderTick(){var t=today(),U=upcomingNow().slice(0,5);
  $('tick').innerHTML='<div class="lbl">Upcoming<br>at PCT</div>'+U.map(function(u){var d=isDate(u.when),now=d&&u.when===t;

    return '<a class="ti" href="'+esc(href)+'"'+(ex?' target="_blank" rel="noopener"':'')+'><span class="w'+(now?' now':'')+'">'+lab+'</span><b>'+esc(u.title)+'</b>'+(u.sub?'<span class="s">'+esc(u.sub)+'</span>':'')+'</a>'}).join('')+

  '<p class="small mut" style="margin:0">One item per line: <b>when | time | title | details | link</b>. For &ldquo;when,&rdquo; use a date like 2026-11-01 (it disappears after that day) or words like &ldquo;Wednesdays&rdquo; (it always shows). Link is optional: a web address, or #news, #resources, #shows.</p>'+
  '<label class="f" for="u_t">Items</label><textarea id="u_t" style="min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:14px">'+esc(txt)+'</textarea>'+
  '<div class="foot"><span class="status" id="st"></span><div class="row"><button class="btn" id="cx2">Cancel</button><button class="btn red" id="sv">Save</button></div></div></div>';
  var cancel=function(){go('home')};$('cx').onclick=cancel;$('cx2').onclick=cancel;
  $('sv').onclick=function(){var st=$('st'),out=[],bad='';
    $('u_t').value.split('\n').forEach(function(l,i){if(!l.trim())return;var f=l.split('|').map(function(x){return x.trim()});

function route(){main.onclick=null;if(SEARCHING){SEARCHING=false;$('gq').value=''}var h=hashNow();
  var m=/^game-(\d+)$/.exec(h), tab='home';
  var hm=/^match-(\d{4}-\d{2}-\d{2})$/.exec(h);
  if(m||h==='games'||h==='lookup'||h==='pick')tab='games';else if(h==='news')tab='news';else if(h==='highlights'||hm)tab='highlights';else if(/^(resources|info|schedule|shows|pdx|dipwad)$/.test(h))tab='resources';
  ['home','news','highlights','resources','games'].forEach(function(t){$('n_'+t).className=t===tab?'on':''});
  renderTick();
  if(h==='upcoming-edit'){if(EDIT)return upcomingForm();}
  if(m&&byId(m[1]))return gamePage(byId(m[1]));
  if(h==='pick'){GMODE='pick';return gamesPage()}
  if(tab==='games')return gamesPage();
  if(tab==='news')return newsPage();
  if(tab==='highlights')return highlightsPage(hm?hm[1]:null);
  if(tab==='resources'){infoPage();addToc();if(h==='shows'||h==='pdx'||h==='dipwad'){var el=$(h);if(el)el.scrollIntoView()}return}
  return homePage();}

function go(h){CURH=h;try{history.pushState(null,'','#'+h)}catch(e){}if(h!=='shows'&&h!=='pdx'&&h!=='dipwad')window.scrollTo(0,0);route();}
window.addEventListener('popstate',function(){CURH=null;route()});

var PLAYSVG='<svg aria-hidden="true" width="10" height="12" viewBox="0 0 10 12"><path d="M0 0L10 6L0 12Z" fill="currentColor"></path></svg>';
function hlMatches(){return (state.highlights||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})}
function hlUrl(m,t){return 'https://youtu.be/'+encodeURIComponent(m.video)+(t?'?t='+(+t):'')}
function hlTime(t){t=+t||0;var h=Math.floor(t/3600),mi=Math.floor(t%3600/60),s=t%60;return (h?h+':'+('0'+mi).slice(-2):mi)+':'+('0'+s).slice(-2)}
function hlDay(d){var p=(d||'').split('-');if(p.length!==3)return esc(d);return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function hlWinner(m){return m.red.score>m.blue.score?'red':m.blue.score>m.red.score?'blue':''}
function scoreboard(m,big){var w=hlWinner(m);
  function side(c,lab,col,rev){var t=m[c],cls='tm'+(w&&w!==c?' lose':'');
    var name='<div><div class="nm">'+lab+(w===c?'<span class="win">WIN</span>':'')+'</div><div class="cap">Capt. '+esc(t.captain)+'</div></div>',
      bar='<div class="bar" style="background:'+col+'"></div>',sc='<div class="sc">'+(+t.score)+'</div>';
    return '<div class="'+cls+'">'+(rev?sc+name+bar:bar+name+sc)+'</div>'}
  return '<section class="sb'+(big?' big':'')+'" aria-label="Final score"><div class="k"><span>'+(big?'Rec League match · ':'Last match · ')+hlDay(m.date)+'</span>'+
  (big?'':'<a href="#match-'+esc(m.date)+'">Full recap →</a>')+'</div>'+
  '<div class="line">'+side('red','RED','#d7263d')+'<div class="fin">FINAL</div>'+side('blue','BLUE','#2f5bd3',1)+'</div>'+
  (m.summary?'<p>'+esc(m.summary)+'</p>':'')+
  (big?'<div class="acts"><a class="btn red" href="'+hlUrl(m)+'" target="_blank" rel="noopener">'+PLAYSVG+'Watch the full match</a></div>':'')+'</section>'}
function playItem(m,x,lead){return '<li>'+lead+'<div class="bd"><div class="g">'+esc(x.game)+'</div><b>'+esc(x.title)+'</b><p>'+esc(x.blurb)+'</p>'+
  '<div class="acts"><a class="btn red sm" href="'+hlUrl(m,x.t)+'" target="_blank" rel="noopener">'+PLAYSVG+'Watch · '+hlTime(x.t)+'</a>'+
  '<button type="button" class="btn sm cpy" data-u="'+hlUrl(m,x.t)+'">Copy link</button></div></div></li>'}
function topPlays(m){var tp=(m.moments||[]).filter(function(x){return x.top}).sort(function(a,b){return a.top-b.top});
  if(!tp.length)return '';
  return '<section class="sec"><div class="row between"><h2>Top plays of the week</h2><a href="#match-'+esc(m.date)+'" class="small" style="text-transform:none;letter-spacing:0;font:600 14px var(--body)">All highlights</a></div>'+
  '<ol class="plays">'+tp.map(function(x,i){return playItem(m,x,'<span class="n" aria-hidden="true">'+(i+1)+'</span>')}).join('')+'</ol>'+
  '<p class="hlnote">First names only. Want a moment taken down? Ask Kevin or Katya'+(discordLive()?' or post in the '+ext(DISCORD,'Discord'):'')+'.</p></section>'}
function recordBook(m){if(!m||!m.records||!m.records.length)return '';
  return '<section class="sec recs"><h2>Rec League record book</h2>'+m.records.map(function(r){return '<div><span class="l">'+esc(r[0])+'</span><b>'+esc(r[1])+'</b> <span class="mut small">· '+hlDay(m.date)+'</span></div>'}).join('')+'</section>'}
function highlightsPage(date){var M=hlMatches(),m=null;
  for(var i=0;i<M.length;i++)if(!date||M[i].date===date){m=M[i];break}
  if(!m){main.innerHTML='<section class="sec"><h2>Highlights</h2><div class="empty">No highlights yet.</div></section>';return}
  var deb=m.debuts||{};
  function li(n,cap){return '<li>'+(cap?'<b>'+esc(n)+'</b> <span class="mut">· Captain</span>':esc(n))+(deb[n]?' <span class="deb">'+esc(deb[n]).toUpperCase()+'</span>':'')+'</li>'}
  function team(c,lab,cls){var t=m[c];return '<section class="sec '+cls+'"><h2>'+lab+'</h2><ul>'+li(t.captain,1)+t.players.map(function(n){return li(n)}).join('')+'</ul></section>'}
  var others=M.filter(function(x){return x!==m});
  main.innerHTML='<p class="crumb"><a href="#home">Home</a> / <a href="#highlights">Highlights</a> / '+hlDay(m.date)+'</p>'+scoreboard(m,1)+
  '<div class="teams">'+team('red','Red team','tr')+team('blue','Blue team','tb')+
  '<section class="sec tn"><h2>Officials &amp; crew</h2><ul><li><b>'+esc(m.ref)+'</b> <span class="mut">· Ref</span></li>'+(m.crew||[]).map(function(c){return '<li>'+esc(c[0])+' <span class="mut">· '+esc(c[1])+'</span></li>'}).join('')+'</ul></section></div>'+
  '<section class="sec"><h2>Highlights</h2><ol class="plays">'+(m.moments||[]).slice().sort(function(a,b){return a.t-b.t}).map(function(x){return playItem(m,x,'<span class="t">'+hlTime(x.t)+'</span>')}).join('')+'</ol></section>'+
  (m.games&&m.games.length?'<section class="sec"><h2>Games played</h2><ol class="gl">'+m.games.map(function(g){return '<li>'+esc(g)+'</li>'}).join('')+'</ol></section>':'')+
  (others.length?'<section class="sec"><h2>More matches</h2><ul class="plays">'+others.map(function(x){var w=hlWinner(x);return '<li><div class="bd"><a href="#match-'+esc(x.date)+'"><b>'+hlDay(x.date)+'</b></a><p>'+(w?w.toUpperCase()+' wins ':'Tie ')+Math.max(x.red.score,x.blue.score)+'–'+Math.min(x.red.score,x.blue.score)+'</p></div></li>'}).join('')+'</ul></section>':'')+
  '<p class="hlnote">Unofficial. Performers are listed by first name only. Want a moment taken down? Ask Kevin or Katya'+(discordLive()?' or post in the '+ext(DISCORD,'Discord'):'')+'.</p>'}

function list(){
  var q=L.q.trim().toLowerCase();
  var a=G.filter(function(g){
    if(L.cat==='Favorites'&&!g.fav)return false;

    if(q){var t=(g.name+' '+g.desc+' '+g.howto+' '+g.notes).toLowerCase();if(t.indexOf(q)<0)return false}
    return true}).sort(function(x,y){
      if(q){var r=function(g){var i=g.name.toLowerCase().indexOf(q);return i===0?0:i>0?1:2},d=r(x)-r(y);if(d)return d}
      return x.name.localeCompare(y.name,undefined,{numeric:true})});

  $('meta').textContent=a.length+' game'+(a.length===1?'':'s')+'. '+n+' of '+G.length+' have descriptions (marked with a blue dot).';

  var out='',cur=null,buf='';

  a.forEach(function(g){var c=/[0-9]/.test(g.name[0])?'#':g.name[0].toUpperCase();

  '<div class="foot"><span class="status" id="st"></span><div class="row"><button class="btn" id="cx2">Cancel</button><button class="btn red" id="sv">Save game</button></div></div></div>';
  var cancel=function(){gamePage(g)};$('cx').onclick=cancel;$('cx2').onclick=cancel;
  $('sv').onclick=function(){var v=function(id){return $(id).value.trim()};
    if(v('e_desc')!==g.desc)g.draft=false;
    g.desc=v('e_desc');g.players=v('e_pl');g.suggestion=v('e_sg');g.howto=v('e_how');g.notes=v('e_notes');g.adult=$('e_ad').checked;
    g.tags=[].filter.call(document.querySelectorAll('#e_tags input'),function(x){return x.checked}).map(function(x){return x.value});
    this.disabled=true;save($('st'),function(){gamePage(g)})};
}

/* ================= SITE SEARCH ================= */
var SEARCHING=false,sTimer=null;
function snapshot(fn){var real=main,ed=EDIT,tmp=document.createElement('div');main=tmp;EDIT=false;try{fn()}catch(e){}main=real;EDIT=ed;return tmp}
function norm(s){return (s||'').replace(/\s+/g,' ').trim()}
function textOf(el){var d=document.createElement('textarea');d.innerHTML=el.innerHTML.replace(/<[^>]+>/g,' ');return norm(d.value)}
function snip(text,q){var i=text.toLowerCase().indexOf(q);if(i<0)return esc(text.slice(0,120))+(text.length>120?'&hellip;':'');
  var a=Math.max(0,i-60),b=Math.min(text.length,i+q.length+80);
  return (a>0?'&hellip;':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,b))+(b<text.length?'&hellip;':'')}
function jump(page,sel,idx){var done=function(){var els=main.querySelectorAll(sel);if(els[idx])els[idx].scrollIntoView({block:'start'})};
  SEARCHING=false;$('gq').value='';go(page);setTimeout(done,30)}
function siteSearch(raw){
  var q=raw.trim().toLowerCase();
  if(q.length<2){if(SEARCHING){SEARCHING=false;route()}return}
  SEARCHING=true;main.onclick=null;
  var out=[];
  // news
  var N=sortedNews(),nres=[];
  N.forEach(function(n,i){var txt=norm((n.title||'')+' '+n.body+' '+(n.from||''));if(txt.toLowerCase().indexOf(q)>=0)nres.push('<button class="res" data-p="news" data-s="article.post" data-i="'+i+'"><div class="where">League news, '+fmtDate(n.date)+'</div><b>'+esc(n.title||'Rec League update')+'</b><div class="snip">'+snip(norm(n.body),q)+'</div></button>')});
  // home + info sections
  var pres=[];
  [['home',homePage,'Home'],['resources',infoPage,'Resources']].forEach(function(p){
    var secs=snapshot(p[1]).querySelectorAll('section.sec'),k=0;
    [].forEach.call(secs,function(s,i){if(s.id==='latest')return;var h=s.querySelector('h2'),title=h?textOf(h):p[2];var txt=textOf(s);
      if(txt.toLowerCase().indexOf(q)>=0){var body=norm(txt.slice(title.length));pres.push('<button class="res" data-p="'+p[0]+'" data-s="section.sec" data-i="'+i+'"><div class="where">'+p[2]+'</div><b>'+esc(title)+'</b><div class="snip">'+snip(body,q)+'</div></button>')}});
  });
  // games
  var gm=G.filter(function(g){return (g.name+' '+g.desc+' '+g.howto+' '+g.notes).toLowerCase().indexOf(q)>=0}).sort(function(a,b){var r=function(g){var i=g.name.toLowerCase().indexOf(q);return i===0?0:i>0?1:2};return r(a)-r(b)||a.name.localeCompare(b.name)});
  var gres=gm.slice(0,8).map(function(g){return '<button class="res" data-g="'+g.id+'"><div class="where">Game, '+esc(g.tags.join(', '))+'</div><b>'+esc(g.name)+'</b>'+(g.desc?'<div class="snip">'+snip(norm(g.desc),q)+'</div>':'')+'</button>'});
  var total=nres.length+pres.length+gm.length;
  main.innerHTML='<div class="sec" style="padding-top:22px"><h2 style="font-size:30px;margin:0">'+total+' result'+(total===1?'':'s')+' for &ldquo;'+esc(raw.trim())+'&rdquo;</h2></div>'+
   (pres.length?'<div class="rgroup">Pages</div>'+pres.join(''):'')+
   (nres.length?'<div class="rgroup">News</div>'+nres.join(''):'')+
   (gres.length?'<div class="rgroup">Games</div>'+gres.join('')+(gm.length>8?'<p><button class="linkish" id="allg">See all '+gm.length+' matching games</button></p>':''):'')+
   (total?'':'<div class="empty" style="margin-top:14px">Nothing matches. Try a shorter word, like &ldquo;parking&rdquo; or &ldquo;Discord&rdquo;.</div>');
  main.onclick=function(e){var b=e.target.closest('.res,#allg');if(!b)return;setMenu(false);
    if(b.id==='allg'){L.q=raw.trim();L.cat='All';GMODE='browse';SEARCHING=false;$('gq').value='';go('games');return}
    if(b.dataset.g){SEARCHING=false;$('gq').value='';go('game-'+b.dataset.g);return}
    jump(b.dataset.p,b.dataset.s,+b.dataset.i)};
  ['home','news','resources','games'].forEach(function(t){$('n_'+t).className=''});
}
$('gq').addEventListener('input',function(){var v=this.value;clearTimeout(sTimer);sTimer=setTimeout(function(){siteSearch(v)},120)});
$('gq').addEventListener('keydown',function(e){if(e.key==='Escape'){this.value='';siteSearch('')}});

/* ================= SAVE ================= */
function doc(){var j=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>'+HEAD+'</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="data">'+j+'<\/script>\n<script id="app">'+APP+'<\/script>\n</body>\n</html>'}
function save(st,done){
  if(!art){try{localStorage.setItem('csz_data',JSON.stringify(state))}catch(e){}st.textContent='Saved in this browser only.';done&&done();return}
  st.textContent='Saving';
  art.publish(doc()).then(function(){st.textContent='Saved.';done&&done()}).catch(function(e){
    var c=e&&(e.code||e.message)||'';
    st.textContent=/conflict/.test(c)?'Another copy saved first. Reloading with the latest.':/not_granted|not_writer/.test(c)?'This is a read-only view, so changes weren’t saved.':'Couldn’t save: '+c;
    var b=$('sv');if(b)b.disabled=false});
}

var SB_URL='https://rwgnqoekvafejhltqhri.supabase.co', SB_KEY='sb_publishable_eK00y0GIVEUcxrL_WwFZSQ_j69dqjnW';
try{if(!(window.claude&&window.claude.use)&&window.fetch)fetch(SB_URL+'/rest/v1/site_lists?select=key,items',{headers:{apikey:SB_KEY}}).then(function(r){return r.ok?r.json():null}).then(function(rows){
  if(!Array.isArray(rows))return;var ch=false;
  rows.forEach(function(r){if((r.key==='news'||r.key==='upcoming'||r.key==='highlights')&&Array.isArray(r.items)&&r.items.length&&JSON.stringify(r.items)!==JSON.stringify(state[r.key])){state[r.key]=r.items;ch=true}});
  if(ch){renderTick();if(!SEARCHING)route()}}).catch(function(){})}catch(e){}
try{if(window.claude&&claude.use)claude.use('user').then(function(u){if(!u)return;
  Promise.resolve(u.isOwner()).then(function(o){var e=!!o;if(e!==EDIT){EDIT=e;route()}}).catch(function(){})})}catch(e){}
try{if(window.claude&&claude.use)claude.use('artifact').then(function(a){art=a;if(!a){try{var s=JSON.parse(localStorage.getItem('csz_data'));if(s&&s.games){state=s;G=s.games;if(!state.news)state.news=[];if(!state.social)state.social=[];route()}}catch(e){}}})}catch(e){}
})();
